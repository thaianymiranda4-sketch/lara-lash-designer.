<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lara Lash Designer</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #e9b9ad;
      font-family: Arial, sans-serif;
    }

    .capa {
      position: relative;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    .capa img {
      display: block;
      width: 100%;
      height: auto;
    }

    .botao-agenda {
      position: absolute;
      left: 7%;
      top: 71%;
      width: 86%;
      height: 9%;
      cursor: pointer;
      border: none;
      background: transparent;
    }
  </style>
</head>
<body>
  <div class="capa">
    <img src="capa-lara.jpg" alt="Lara Lash Designer">

    <button class="botao-agenda"
      aria-label="Abrir agenda"
      onclick="abrirAgenda()">
    </button>
  </div>

  <script>
    function abrirAgenda() {
      alert("Agenda da Lara - próxima etapa!");
    }
  </script>
</body>
</html>
